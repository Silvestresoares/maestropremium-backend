version: '3.8'

services:
  backend:
    build:
      context: https://github.com/Silvestresoares/maestropremium-backend.git#main
      dockerfile: Dockerfile
    container_name: maestro-backend
    restart: unless-stopped
    ports:
      # Exposição na porta 3333 da VPS (não colide com portas 3005 e 3006 de outros apps)
      - "3333:3333"
    environment:
      - PORT=3333
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_API_URL=${ASAAS_API_URL}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      # Volume persistente para partituras, fotos e arquivos de áudio
      - maestro_uploads:/app/uploads
    networks:
      - maestro-network
    deploy:
      resources:
        limits:
          memory: 800M
          cpus: '1.0'

volumes:
  maestro_uploads:
    name: maestro_uploads

networks:
  maestro-network:
    name: maestro-network
    driver: bridge